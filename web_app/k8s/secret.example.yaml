# Copy to secret.yaml (git-ignored), fill in, and `kubectl apply -f`. Mounted into every runner pod
# as environment variables. Only add the providers you use.
apiVersion: v1
kind: Secret
metadata:
  name: otto-runtime-secrets
  namespace: otto
type: Opaque
stringData:
  DEEPSEEK_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  GOOGLE_API_KEY: ""
  # Shared secret between backend and runners. Set the same value in the backend's environment
  # (OTTO_RUNNER_TOKEN). Generate with: openssl rand -hex 32
  OTTO_RUNNER_TOKEN: ""
